<svg viewBox="0 0 250 40" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feFlood flood-color="#00f2ff" flood-opacity="0.8" result="color" />
            <feComposite in="color" in2="blur" operator="in" result="glow" />
            <feMerge>
                <feMergeNode in="glow" />
                <feMergeNode in="glow" /> <!-- グローを重ねて強調 -->
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <text x="0" y="32" font-family="Outfit, sans-serif" font-weight="600" fill="#ffffff" font-size="28" letter-spacing="2" filter="url(#glow)">MAGIC CRYSTAL</text>
</svg>
