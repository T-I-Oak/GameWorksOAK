<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>UI State Test - GameWorks OAK</title>
    <link rel="stylesheet" href="../index.css">
    <style>
        .test-container { padding: 2rem; border: 1px dashed #666; margin-bottom: 2rem; }
        .test-label { font-weight: bold; margin-bottom: 1rem; display: block; color: var(--accent); }
    </style>
</head>
<body>
    <div class="Container">
        <h1>UI Components & States Test</h1>

        <div class="test-container">
            <span class="test-label">1. Game Card (Dynamic Style)</span>
            <div class="GamesGrid" id="testGrid"></div>
        </div>

        <div class="test-container">
            <span class="test-label">2. Modal States (Overlay)</span>
            <button onclick="document.getElementById('modalOverlay').classList.add('active')">Open Modal</button>
        </div>
    </div>

    <div class="ModalOverlay" id="modalOverlay">
        <div class="ModalContent">
            <button class="ModalClose" onclick="document.getElementById('modalOverlay').classList.remove('active')">&times;</button>
            <h2 class="ModalTitle">Test Modal</h2>
            <div id="modalBody">
                <div class="LoadingSpinner">Loading spinner test...</div>
            </div>
            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button onclick="renderSampleHistory()">Render Sample History</button>
                <button onclick="renderError()">Render Error State</button>
            </div>
        </div>
    </div>

    <script>
        const SAMPLE_PROJECT = {
            id: "test",
            title: "Test Game",
            tags: ["Tag1", "Tag2"],
            description: "This is a test description for the dynamically generated card.",
            image: "../assets/burst_cascade.png",
            url: "#",
            status: "TESTING"
        };

        const SAMPLE_HISTORY = [
            {
                version: "1.0.0",
                date: "2026-05-11",
                title: "Initial Test",
                description: "Description of test update.",
                changes: ["Change A", "Change B"]
            }
        ];

        function renderTestCard() {
            const grid = document.getElementById('testGrid');
            grid.innerHTML = `
                <!-- Normal Project -->
                <div class="GameCard visible">
                    <div class="GameImg" style="background-image: url('${SAMPLE_PROJECT.image}');">
                        <span class="badge">RELEASED</span>
                    </div>
                    <div class="GameInfo">
                        <h3>${SAMPLE_PROJECT.title} (Released)</h3>
                        <div class="tags">
                            ${SAMPLE_PROJECT.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <p>${SAMPLE_PROJECT.description}</p>
                        <div class="BtnGroup">
                            <a href="#" class="BtnMore">PLAY</a>
                        </div>
                    </div>
                </div>

                <!-- Disabled Project -->
                <div class="GameCard visible">
                    <div class="GameImg" style="background-image: url('${SAMPLE_PROJECT.image}');">
                        <span class="badge">COMING SOON</span>
                    </div>
                    <div class="GameInfo">
                        <h3>${SAMPLE_PROJECT.title} (Coming Soon)</h3>
                        <div class="tags">
                            ${SAMPLE_PROJECT.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <p>${SAMPLE_PROJECT.description}</p>
                        <div class="BtnGroup">
                            <a href="javascript:void(0)" class="BtnMore disabled" onclick="return false;">COMING SOON</a>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSampleHistory() {
            const body = document.getElementById('modalBody');
            body.innerHTML = SAMPLE_HISTORY.map(item => `
                <div class="HistoryItem">
                    <div class="HistoryHeader">
                        <span class="HistoryVersion">v${item.version}</span>
                        <span class="HistoryDate">${item.date}</span>
                    </div>
                    <div class="HistoryTitle">${item.title}</div>
                    <ul class="HistoryChanges">
                        ${item.changes.map(change => `<li>${change}</li>`).join('')}
                    </ul>
                </div>
            `).join('');
        }

        function renderError() {
            const body = document.getElementById('modalBody');
            body.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Error state test message.</p>';
        }

        window.onload = renderTestCard;
    </script>
</body>
</html>
